<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Redbridge Directory Logo (White Version)">
  <g id="logo-mark">
    <rect x="4" y="8" width="48" height="48" rx="12" fill="#FF8717" />
    <path d="M 28 16 L 36 28 L 28 40 L 20 28 Z" fill="#032C4D" />
    <circle cx="28" cy="28" r="4.5" fill="#FFFFFF" />
    <circle cx="28" cy="18" r="2" fill="#FFFFFF" />
    <circle cx="38" cy="28" r="2" fill="#032C4D" />
    <circle cx="28" cy="38" r="2" fill="#032C4D" />
    <circle cx="18" cy="28" r="2" fill="#032C4D" />
