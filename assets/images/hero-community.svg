<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="Visual representation of Redbridge connected local business community">
  <defs>
    <!-- Soft subtle gradient for background card -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#032C4D" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect x="10" y="10" width="540" height="420" rx="20" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Subtle Borough Map Contour Network -->
  <g opacity="0.45" stroke="#CAD8E6" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
    <path d="M 60 120 C 140 100, 220 140, 280 110 C 340 80, 420 130, 500 100" />
    <path d="M 50 250 C 130 220, 240 280, 310 230 C 380 180, 450 260, 510 220" />
    <path d="M 120 360 C 200 320, 290 350, 380 320 C 440 300, 480 340, 520 330" />
    <line x1="280" y1="110" x2="310" y2="230" stroke="#FF8717" stroke-width="1.5" stroke-dasharray="none" opacity="0.6" />
    <line x1="160" y1="190" x2="310" y2="230" stroke="#032C4D" stroke-width="1.5" opacity="0.4" />
    <line x1="310" y1="230" x2="420" y2="250" stroke="#032C4D" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Redbridge Borough High Street Skyline Silhouettes -->
  <g fill="#E2E8F0" opacity="0.8">
    <!-- Building 1: Independent Retail Storefront -->
    <rect x="70" y="270" width="70" height="90" rx="4" />
    <polygon points="65,270 105,245 145,270" fill="#CBD5E1" />
    <rect x="80" y="290" width="20" height="25" rx="2" fill="#FFFFFF" />
    <rect x="110" y="290" width="20" height="25" rx="2" fill="#FFFFFF" />
    <rect x="92" y="325" width="26" height="35" rx="2" fill="#94A3B8" />

    <!-- Building 2: Town Hall Clocktower Accent -->
    <rect x="160" y="220" width="80" height="140" rx="4" fill="#CBD5E1" />
    <polygon points="155,220 200,175 245,220" fill="#94A3B8" />
    <circle cx="200" cy="205" r="9" fill="#FFFFFF" stroke="#032C4D" stroke-width="1.5" />
    <line x1="200" y1="200" x2="200" y2="205" stroke="#032C4D" stroke-width="1.5" />
    <line x1="200" y1="205" x2="204" y2="205" stroke="#FF8717" stroke-width="1.5" />
    <rect x="175" y="240" width="16" height="24" rx="2" fill="#FFFFFF" />
    <rect x="209" y="240" width="16" height="24" rx="2" fill="#FFFFFF" />
    <rect x="175" y="280" width="16" height="24" rx="2" fill="#FFFFFF" />
    <rect x="209" y="280" width="16" height="24" rx="2" fill="#FFFFFF" />

    <!-- Building 3: Professional Business Offices -->
    <rect x="260" y="250" width="90" height="110" rx="4" />
    <rect x="275" y="265" width="18" height="22" rx="2" fill="#FFFFFF" />
    <rect x="305" y="265" width="18" height="22" rx="2" fill="#FFFFFF" />
    <rect x="275" y="300" width="18" height="22" rx="2" fill="#FFFFFF" />
    <rect x="305" y="300" width="18" height="22" rx="2" fill="#FFFFFF" />

    <!-- Building 4: Local Services & Creative Studio -->
    <rect x="370" y="265" width="75" height="95" rx="4" fill="#CBD5E1" />
    <polygon points="365,265 407,240 450,265" fill="#94A3B8" />
    <rect x="385" y="280" width="45" height="30" rx="2" fill="#FFFFFF" />
    <rect x="395" y="325" width="25" height="35" rx="2" fill="#94A3B8" />

    <!-- Ground Baseline -->
    <line x1="40" y1="360" x2="520" y2="360" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Interactive Community Node 1: High Street & Retail (Ilford & Wanstead) -->
  <g transform="translate(60, 60)" filter="url(#cardShadow)">
    <rect width="180" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="32" cy="32" r="16" fill="#FFF7ED" stroke="#FF8717" stroke-width="1.5" />
    <!-- Shop / bag icon -->
    <path d="M 27 28 L 37 28 L 38 38 L 26 38 Z" fill="none" stroke="#FF8717" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 29 28 C 29 24, 35 24, 35 28" fill="none" stroke="#FF8717" stroke-width="1.5" />
    <text x="56" y="28" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#032C4D">Local Retail &amp; Food</text>
    <text x="56" y="44" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Wanstead &amp; Ilford</text>
  </g>

  <!-- Interactive Community Node 2: Central Redbridge Directory Hub -->
  <g transform="translate(180, 160)" filter="url(#cardShadow)">
    <rect width="200" height="76" rx="14" fill="#032C4D" stroke="#FF8717" stroke-width="1.5" />
    <!-- Location Pin Accent -->
    <circle cx="36" cy="38" r="18" fill="#FF8717" />
    <path d="M 36 26 C 31 26, 28 30, 28 34 C 28 41, 36 48, 36 48 C 36 48, 44 41, 44 34 C 44 30, 41 26, 36 26 Z" fill="#FFFFFF" />
    <circle cx="36" cy="34" r="3" fill="#032C4D" />
    <text x="64" y="33" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Redbridge Directory</text>
    <text x="64" y="49" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FF8717">BOROUGH-WIDE HUB</text>
    <text x="64" y="63" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#CAD8E6">Chamber of Commerce</text>
  </g>

  <!-- Interactive Community Node 3: Professional & Commercial Services -->
  <g transform="translate(320, 65)" filter="url(#cardShadow)">
    <rect width="190" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="32" cy="32" r="16" fill="#F0F9FF" stroke="#032C4D" stroke-width="1.5" />
    <!-- Briefcase icon -->
    <rect x="25" y="27" width="14" height="11" rx="1.5" fill="none" stroke="#032C4D" stroke-width="1.5" />
    <path d="M 29 27 L 29 24 C 29 23, 35 23, 35 24 L 35 27" fill="none" stroke="#032C4D" stroke-width="1.5" />
    <text x="56" y="28" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#032C4D">Professional Services</text>
    <text x="56" y="44" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Woodford &amp; Gants Hill</text>
  </g>

  <!-- Interactive Community Node 4: Community & Trades (Bottom Right) -->
  <g transform="translate(310, 275)" filter="url(#cardShadow)">
    <rect width="210" height="68" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="32" cy="34" r="16" fill="#FFF7ED" stroke="#FF8717" stroke-width="1.5" />
    <!-- People / Network Icon -->
    <circle cx="32" cy="30" r="4" fill="none" stroke="#FF8717" stroke-width="1.5" />
    <path d="M 25 41 C 25 37, 39 37, 39 41" fill="none" stroke="#FF8717" stroke-width="1.5" />
    <text x="56" y="29" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#032C4D">RCC Member Network</text>
    <text x="56" y="45" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#032C4D">FREE ASSOCIATE ACCESS</text>
    <text x="56" y="58" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#64748B">WhatsApp Business Group</text>
  </g>

  <!-- Connecting Pin Point with Pulsing Ring on Central Hub -->
  <circle cx="310" cy="230" r="5" fill="#FF8717" />
  <circle cx="310" cy="230" r="10" fill="none" stroke="#FF8717" stroke-width="1.5" opacity="0.6" />

  <!-- Bottom Badge: Chamber Backing Assurance -->
  <g transform="translate(145, 385)">
    <rect width="270" height="32" rx="16" fill="#032C4D" />
    <circle cx="20" cy="16" r="6" fill="#FF8717" />
    <path d="M 17 16 L 19 18 L 23 14" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <text x="34" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" letter-spacing="0.04em">
      AN OFFICIAL INITIATIVE OF REDBRIDGE CHAMBER
    </text>
  </g>
</svg>
